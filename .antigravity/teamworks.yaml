version: "2.0"
teamwork: "spec-driven-pipeline"
description: "Sequential pipeline: Intake -> Plan -> Grill -> Teamwork Preview."
pipeline:
  - stage: "intake"
    input_path: ".spec/01_intake/"
  - stage: "plan"
    dependency: "intake"
    output_path: ".spec/02_planning/"
  - stage: "grill"
    dependency: "plan"
    output_path: ".spec/03_grill/"
  - stage: "teamwork-preview"
    dependency: "grill"
    output_path: ".spec/04_teamwork/"
